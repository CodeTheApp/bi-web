# AWS Amplify Hosting (SSR, plataforma WEB_COMPUTE)
version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 22 && nvm use 22
        - npm ci
    build:
      commands:
        # No Amplify, variáveis do console só chegam às funções do servidor se estiverem em .env.production
        - env | grep -E '^(NEXT_PUBLIC_|SUPABASE_|S3_|RESEND_|EMAIL_|TURNSTILE_|ADMIN_DEMO)' >> .env.production || true
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - node_modules/**/*
